name: Resize video players

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-video-players.yml'

permissions:
  contents: write

jobs:
  resize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add responsive video sizing overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- cj-video-size-overrides-v1 -->'
          if marker in html:
              raise SystemExit(0)

          css = r'''
          <!-- cj-video-size-overrides-v1 -->
          <style id="cj-video-size-overrides-v1">
            /* Keep the original HQ files; only reduce their visual footprint. */
            @media (min-width: 769px){
              .results-featured{
                max-width:820px;
                margin-left:auto;
                margin-right:auto;
              }
              .results-featured .featured-video{
                width:100%;
                max-width:360px;
                margin-left:auto;
                margin-right:auto;
                justify-self:center;
              }
              .phone-video{
                width:100%;
                max-width:320px;
                margin-left:auto;
                margin-right:auto;
                justify-self:center;
              }
            }
            @media (max-width: 768px){
              .results-featured{
                width:100%;
                max-width:100%;
                gap:18px;
              }
              .results-featured .featured-video{
                width:min(76vw, 285px);
                max-width:285px;
                margin-left:auto;
                margin-right:auto;
                justify-self:center;
              }
              .phone-video{
                width:min(70vw, 250px);
                max-width:250px;
                margin-left:auto;
                margin-right:auto;
                justify-self:center;
              }
            }
          </style>
          '''

          if '</head>' not in html:
              raise SystemExit('Closing </head> tag not found')
          html = html.replace('</head>', css + '\n</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit page update
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce video display size on desktop and mobile"
          git push
